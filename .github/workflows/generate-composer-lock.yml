name: Generate Composer Lockfile

on:
  push:
    branches: [main]
    paths:
      - 'composer.json'
      - '.github/workflows/generate-composer-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Generate composer.lock
        run: composer update --lock --no-install --no-interaction --prefer-dist

      - name: Commit composer.lock
        run: |
          if git diff --quiet -- composer.lock && git ls-files --error-unmatch composer.lock >/dev/null 2>&1; then
            echo "composer.lock already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "Generate Composer lockfile"
          git push
