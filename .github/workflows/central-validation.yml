name: Central Master Admin Validation

on:
  push:
    branches:
      - feature/central-master-admin
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Validate Composer manifest
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax check
        run: |
          set -e
          find app bootstrap config database routes scripts -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Prepare test environment
        run: |
          cp .env.example .env
          touch database/database.sqlite
          sed -i 's/^APP_ENV=.*/APP_ENV=testing/' .env
          sed -i 's/^APP_DEBUG=.*/APP_DEBUG=true/' .env
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i 's|^DB_DATABASE=.*|DB_DATABASE=database/database.sqlite|' .env
          sed -i 's/^SESSION_DRIVER=.*/SESSION_DRIVER=file/' .env
          sed -i 's/^CACHE_STORE=.*/CACHE_STORE=file/' .env
          sed -i 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env
          sed -i 's/^MAIL_MAILER=.*/MAIL_MAILER=log/' .env
          php artisan key:generate --force

      - name: Laravel bootstrap and route validation
        run: |
          php artisan optimize:clear
          php artisan about
          php artisan route:list

      - name: Fresh database migration
        run: php artisan migrate:fresh --force

      - name: Central audit
        run: php artisan mci:central-audit

      - name: Functional rollback-safe validation
        run: php scripts/functional-check.php
